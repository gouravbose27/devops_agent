[project]
name = "devops_agent"
version = "0.1.0"
description = "devops_agent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]==1.14.5a2",
    "exa_py",
]

[project.scripts]
devops_agent = "devops_agent.main:run"
run_crew = "devops_agent.main:run"
train = "devops_agent.main:train"
replay = "devops_agent.main:replay"
test = "devops_agent.main:test"
run_with_trigger = "devops_agent.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
